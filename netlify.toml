# Netlify settings for the SpotLight website

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The forms post to /api/enquiry; this forwards it to the email function.
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200

# Keep the admin dashboard private from search engines and never store it in caches
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
